appId: br.com.aloi.videoeditor
productName: VideoEditor
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - resources/**/*
  - package.json
asarUnpack:
  # `?asset` imports (the window icon) are resolved next to the bundle at runtime.
  - resources/**
  # Native addons cannot load from inside app.asar: keep sharp and its @img/* binaries on disk.
  - node_modules/sharp/**
  - node_modules/@img/**
# sharp ships N-API prebuilds; there is nothing to rebuild against Electron.
npmRebuild: false
win:
  executableName: VideoEditor
  icon: resources/icon.png
  target:
    - target: nsis
      arch: x64
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
linux:
  target: AppImage
  category: AudioVideo
  icon: resources/icon.png
appImage:
  artifactName: ${productName}-${version}.${ext}
